<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="把多行文本一键转成 SQL IN 列表：加单引号或保持原样，逗号连接，自动跳过空行。">
    <title>文本转换工作台 · 多行文本 → SQL IN 列表</title>
    <style>
        :root {
            color-scheme: dark;
            --ink-900: #070C16;
            --well: #0A1526;
            --line: #24344F;
            --line-soft: #1B2740;
            --text: #E5EBF6;
            --muted: #8B9DBC;
            --faint: #6D80A3;
            --amber: #FFB454;
            --amber-glow: rgba(255, 180, 84, .14);
            --mint: #6FE3B0;
            --rose: #E4818F;
            --font-display: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
            --font-body: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
            --r-lg: 12px;
            --r-md: 9px;
        }

        html,
        body {
            height: 100%;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--ink-900);
            background-image: radial-gradient(1100px 560px at 50% -12%, #14203A 0%, rgba(20, 32, 58, 0) 68%);
            color: var(--text);
            font: 15px/1.5 var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* 图纸网格 + 顶部信号条 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(96, 134, 200, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 134, 200, .055) 1px, transparent 1px);
            background-size: 34px 34px;
            -webkit-mask-image: radial-gradient(ellipse 85% 62% at 50% 0%, #000 0%, transparent 74%);
            mask-image: radial-gradient(ellipse 85% 62% at 50% 0%, #000 0%, transparent 74%);
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, var(--amber) 20%, #8FB8FF 64%, transparent);
            opacity: .8;
        }

        .wrap {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px 26px 20px;
            overflow: hidden;
        }

        /* 抬头 */
        .masthead {
            display: flex;
            flex-wrap: wrap;
            flex: none;
            gap: 16px 24px;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line-soft);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .eyebrow::before {
            content: "";
            width: 18px;
            height: 1px;
            background: var(--amber);
        }

        .masthead h1 {
            margin: 8px 0 0;
            font-family: var(--font-display);
            font-size: clamp(23px, 2.4vw, 31px);
            font-weight: 600;
            letter-spacing: .01em;
        }

        .lede {
            margin: 7px 0 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 13.5px;
        }

        .lede code {
            font-family: var(--font-mono);
            font-size: .92em;
            color: var(--amber);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .chip {
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(22, 36, 61, .45);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11.5px;
        }

        /* 工作台 */
        .bench {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.12fr) 154px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr);
            flex: 1;
            min-height: 0;
            gap: 16px;
            align-items: stretch;
            margin-top: 22px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 14px 14px 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: linear-gradient(180deg, rgba(22, 36, 61, .72), rgba(14, 24, 41, .94));
            box-shadow: 0 20px 44px -30px #000;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .panel__head {
            display: flex;
            flex: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .panel__title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-family: var(--font-display);
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: .04em;
        }

        /* 方块标记：输入空心、输出实心 */
        .panel__title::before {
            content: "";
            width: 7px;
            height: 7px;
            border: 1.5px solid var(--amber);
            border-radius: 1px;
        }

        .panel--out .panel__title::before {
            background: var(--amber);
        }

        /* 面板头部的操作按钮靠右 */
        .panel__head .btn {
            margin-left: auto;
        }

        /* 数据区：行号栏 + 文本框 */
        .pane {
            display: flex;
            flex: 1;
            min-height: 108px;
            overflow: hidden;
            border: 1px solid var(--line-soft);
            border-radius: var(--r-md);
            background: var(--well);
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .pane:hover {
            border-color: #2C3F5E;
        }

        .pane:focus-within {
            border-color: var(--amber);
            background: #0B1728;
            box-shadow: 0 0 0 3px var(--amber-glow);
        }

        /* 行号栏：与正文同字号同行高，纵向滚动由脚本同步 */
        .gutter {
            flex: none;
            min-width: 52px;
            padding: 12px 10px 12px 6px;
            overflow: hidden;
            border-right: 1px solid var(--line-soft);
            background: rgba(255, 255, 255, .018);
            color: #4C5F80;
            font: 14px/23px var(--font-mono);
            text-align: right;
            white-space: pre;
            user-select: none;
            -webkit-user-select: none;
        }

        .field {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 0;
            background: transparent;
            color: var(--text);
            font: 14px/23px var(--font-mono);
            tab-size: 4;
            outline: none;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .field::placeholder {
            color: var(--faint);
        }

        /* 数据区滚动条 */
        .field::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .field::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .025);
        }

        .field::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 8px;
            background-color: #33486B;
            background-clip: content-box;
        }

        .field::-webkit-scrollbar-thumb:hover {
            background-color: #4C6A9B;
        }

        .field::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* 总数据量读数 */
        .stats {
            display: flex;
            flex-wrap: wrap;
            flex: none;
            align-items: center;
            gap: 8px 20px;
            margin-top: 14px;
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: linear-gradient(180deg, rgba(22, 36, 61, .6), rgba(14, 24, 41, .9));
        }

        .stats__label {
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .16em;
        }

        .stats__side {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stats__side-name {
            color: var(--faint);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .08em;
        }

        .stats__num {
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 19px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stats__unit {
            color: var(--faint);
            font-size: 11.5px;
            font-style: normal;
        }

        .stats__arrow {
            color: var(--amber);
            font-family: var(--font-mono);
        }

        /* 转换轨 */
        .rail {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .rail__label {
            margin: 0 0 2px;
            text-align: center;
            color: var(--faint);
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .24em;
        }

        .rail__btn {
            position: relative;
            flex-direction: column;
            gap: 2px;
            padding: 10px 6px;
            line-height: 1.24;
        }

        /* 按钮之间的短接点，串成一条总线 */
        .rail__btn::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -11px;
            width: 1px;
            height: 11px;
            background: var(--line);
            transform: translateX(-50%);
        }

        .rail__btn:first-of-type::before {
            display: none;
        }

        .rail__btn b {
            font-size: 13.5px;
            font-weight: 600;
        }

        .rail__btn span {
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 400;
            letter-spacing: 0;
            transition: color .16s ease;
        }

        .rail__btn:hover span {
            color: var(--amber);
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            background: linear-gradient(180deg, #19263F, #121D31);
            color: var(--text);
            font-family: var(--font-display);
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: .03em;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
        }

        .btn:hover {
            border-color: #3A527A;
            transform: translateY(-1px);
            box-shadow: 0 12px 22px -16px #000;
        }

        .btn:active {
            transform: translateY(0) scale(.985);
        }

        .btn:focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: 2px;
        }

        .btn--ghost {
            padding: 6px 11px;
            border-color: transparent;
            background: transparent;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .btn--ghost:hover {
            border-color: rgba(228, 129, 143, .35);
            background: rgba(228, 129, 143, .07);
            color: var(--rose);
            transform: none;
            box-shadow: none;
        }

        .btn--primary {
            border-color: #FFC978;
            background: linear-gradient(180deg, #FFC978, #FFAD42);
            color: #241400;
            box-shadow: 0 14px 28px -18px rgba(255, 180, 84, .95);
        }

        .btn--primary:hover {
            border-color: #FFD79A;
            background: linear-gradient(180deg, #FFD79A, #FFB454);
        }

        .btn--primary:active {
            background: linear-gradient(180deg, #FFBE63, #F09C2C);
        }

        /* 转换命中：结果面板亮边 + 内容淡入 */
        .panel--out.is-hit {
            border-color: rgba(255, 180, 84, .5);
            box-shadow: 0 0 0 1px rgba(255, 180, 84, .18), 0 20px 44px -30px #000;
        }

        .panel--out.is-hit .field {
            animation: reveal .34s cubic-bezier(.2, .7, .3, 1);
        }

        @keyframes reveal {
            from {
                opacity: .3;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* 每次转换：一道扫描光从左扫到右 */
        .scan {
            position: absolute;
            inset: 0;
            z-index: 3;
            overflow: hidden;
            border-radius: var(--r-lg);
            pointer-events: none;
        }

        .scan span {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -180px;
            width: 170px;
            opacity: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 180, 84, .14) 45%, rgba(255, 214, 150, .3) 50%, rgba(255, 180, 84, .14) 55%, transparent);
        }

        .bench.is-firing .scan span {
            animation: sweep .85s cubic-bezier(.35, .05, .25, 1);
        }

        @keyframes sweep {
            0% {
                opacity: 0;
                left: -180px;
            }

            14% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                left: 100%;
            }
        }

        /* 提示条 */
        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: min(380px, calc(100vw - 44px));
            padding: 11px 15px;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            background: linear-gradient(180deg, #18263F, #111C30);
            box-shadow: 0 26px 46px -28px #000;
            color: var(--text);
            font-size: 13.5px;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity .24s ease, transform .24s ease;
        }

        .toast::before {
            content: "";
            flex: none;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 0 3px rgba(111, 227, 176, .18);
        }

        .toast[data-tone="warn"]::before {
            background: var(--amber);
            box-shadow: 0 0 0 3px var(--amber-glow);
        }

        .toast[data-tone="err"]::before {
            background: var(--rose);
            box-shadow: 0 0 0 3px rgba(228, 129, 143, .18);
        }

        .toast.is-on {
            opacity: 1;
            transform: none;
        }

        /* 页脚 */
        .foot {
            display: flex;
            flex-wrap: wrap;
            flex: none;
            gap: 8px 20px;
            align-items: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--line-soft);
            color: var(--faint);
            font-family: var(--font-mono);
            font-size: 11.5px;
        }

        kbd {
            padding: 2px 6px;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 4px;
            background: #141F33;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
        }

        @media (max-width: 1120px) {
            .bench {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
            }

            .rail {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .rail__label {
                display: none;
            }

            .rail__btn {
                flex: 1 1 152px;
            }

            .rail__btn::before {
                display: none;
            }

            .pane {
                min-height: 140px;
            }
        }

        @media (max-width: 640px) {
            .wrap {
                padding: 24px 15px 16px;
            }

            .panel__head {
                flex-wrap: wrap;
            }

            .toast {
                right: 15px;
                left: 15px;
                bottom: 15px;
                max-width: none;
            }
        }

        /* 视口过矮时收起次要信息，把高度留给数据区 */
        @media (max-height: 640px) {
            .lede,
            .chips,
            .foot {
                display: none;
            }

            .masthead {
                padding-bottom: 10px;
            }

            .bench {
                margin-top: 14px;
            }

            .pane {
                min-height: 72px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="masthead">
            <div>
                <p class="eyebrow">Text Bench</p>
                <h1>文本转换工作台</h1>
                <p class="lede">粘贴多行文本，一次点击得到 SQL <code>IN</code> 列表：解析字符加单引号，解析数字保持原样，空行自动跳过。</p>
            </div>
            <ul class="chips">
                <li class="chip">SQL IN</li>
                <li class="chip">逗号分隔</li>
                <li class="chip">自动跳过空行</li>
            </ul>
        </header>

        <main class="bench">
            <section class="panel" aria-labelledby="titleIn">
                <div class="panel__head">
                    <h2 class="panel__title" id="titleIn">输入</h2>
                    <button class="btn btn--ghost" type="button" id="btnClear">清空</button>
                </div>
                <div class="pane">
                    <div class="gutter" id="gutIn" aria-hidden="true">1</div>
                    <textarea class="field" id="sqlLog" wrap="off" spellcheck="false"
                        placeholder="每行一条，直接粘贴：&#10;1001&#10;1002&#10;1003"></textarea>
                </div>
            </section>

            <div class="rail" role="group" aria-label="转换操作">
                <p class="rail__label">转换</p>
                <button class="btn rail__btn" type="button" data-run="quote" title="每行加单引号，用逗号连接">
                    <b>解析字符</b><span>('a','b')</span>
                </button>
                <button class="btn rail__btn" type="button" data-run="plain" title="每行原样，用逗号连接">
                    <b>解析数字</b><span>(1,2)</span>
                </button>
            </div>

            <section class="panel panel--out" aria-labelledby="titleOut">
                <div class="panel__head">
                    <h2 class="panel__title" id="titleOut">结果</h2>
                    <button class="btn btn--primary" type="button" id="btnCopy">复制 SQL</button>
                </div>
                <div class="pane">
                    <div class="gutter" id="gutOut" aria-hidden="true">1</div>
                    <textarea class="field" id="d1" wrap="off" spellcheck="false"
                        placeholder="转换结果会出现在这里"></textarea>
                </div>
            </section>

            <div class="scan" aria-hidden="true"><span></span></div>
        </main>

        <div class="stats" aria-live="polite">
            <span class="stats__label">总数据量</span>
            <span class="stats__side">
                <span class="stats__side-name">输入</span>
                <b class="stats__num" id="inLines">0</b><i class="stats__unit">行</i>
                <b class="stats__num" id="inChars">0</b><i class="stats__unit">字符</i>
            </span>
            <span class="stats__arrow" aria-hidden="true">→</span>
            <span class="stats__side">
                <span class="stats__side-name">结果</span>
                <b class="stats__num" id="outItems">0</b><i class="stats__unit">条</i>
                <b class="stats__num" id="outChars">0</b><i class="stats__unit">字符</i>
            </span>
        </div>

        <footer class="foot">
            <span><kbd>Ctrl</kbd> + <kbd>1</kbd> <kbd>2</kbd> 运行对应转换</span>
            <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 重复上次转换</span>
            <span>纯本地页面 · 无外部依赖</span>
        </footer>
    </div>

    <div class="toast" id="msg" role="status" aria-live="polite"></div>

    <script>
        (() => {
            const elIn = document.getElementById('sqlLog');
            const elOut = document.getElementById('d1');
            const gutIn = document.getElementById('gutIn');
            const gutOut = document.getElementById('gutOut');
            const bench = document.querySelector('.bench');
            const outPanel = document.querySelector('.panel--out');
            const toastEl = document.getElementById('msg');
            const railBtns = [...document.querySelectorAll('[data-run]')];
            const nums = {
                inLines: document.getElementById('inLines'),
                inChars: document.getElementById('inChars'),
                outItems: document.getElementById('outItems'),
                outChars: document.getElementById('outChars')
            };
            let lastRun = null;
            let outItems = 0;
            let toastTimer = 0;

            const lineCount = (value) => (value === '' ? 0 : value.split('\n').length);

            /* 行号栏：每行一个号，行高与正文一致 */
            const paintGutter = (gut, value) => {
                const count = lineCount(value) || 1;
                if (gut.dataset.count === String(count)) return;
                gut.dataset.count = String(count);
                let text = '';
                for (let i = 1; i <= count; i += 1) text += `${i}\n`;
                gut.textContent = text;
            };

            /* 总数据量读数 */
            const paintStats = () => {
                nums.inLines.textContent = lineCount(elIn.value);
                nums.inChars.textContent = elIn.value.length;
                nums.outItems.textContent = outItems;
                nums.outChars.textContent = elOut.value.length;
            };

            const paintAll = () => {
                paintGutter(gutIn, elIn.value);
                paintGutter(gutOut, elOut.value);
                paintStats();
            };

            /* 重新触发一次 CSS 动画 */
            const restart = (el, cls) => {
                el.classList.remove(cls);
                void el.offsetWidth;
                el.classList.add(cls);
            };

            const showToast = (text, tone = 'ok') => {
                toastEl.textContent = text;
                toastEl.dataset.tone = tone;
                toastEl.classList.add('is-on');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 2600);
            };

            /* 写出结果，同时记录条目数 */
            const writeOut = (items) => {
                outItems = items.length;
                elOut.value = items.length ? '(' + items.join(',') + ')' : '';
                paintAll();
                restart(outPanel, 'is-hit');
            };

            /* 解析字符：每行加单引号 → ('a','b') */
            const quotedItems = (raw) => raw.split('\n')
                .filter((line) => line !== '')
                .map((line) => `'${line}'`)
                .filter((line) => line.trim());

            /* 解析数字：每行原样，跳过空行 → (1,2) */
            const numberItems = (raw) => raw.split('\n').filter((line) => line.trim());

            const run = (mode) => {
                const raw = elIn.value;
                if (!raw.trim()) {
                    showToast('先粘贴要处理的内容', 'warn');
                    elIn.focus();
                    return;
                }
                lastRun = mode;

                const items = mode === 'quote' ? quotedItems(raw) : numberItems(raw);
                writeOut(items);
                showToast(`${mode === 'quote' ? '已生成字符列表' : '已生成数字列表'}，共 ${items.length} 条`);

                restart(bench, 'is-firing');
                setTimeout(() => bench.classList.remove('is-firing'), 900);
            };

            const copyOut = async () => {
                const text = elOut.value;
                if (!text) {
                    showToast('结果为空，先运行一次转换', 'warn');
                    return;
                }
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        elOut.select();
                        if (!document.execCommand('Copy')) throw new Error('copy failed');
                    }
                    showToast('已复制到剪贴板');
                } catch (err) {
                    showToast('复制失败，请手动选中结果复制', 'err');
                }
            };

            const clearInput = () => {
                if (elIn.value === '') {
                    elIn.focus();
                    return;
                }
                elIn.value = '';
                elIn.focus();
                paintAll();
                showToast('已清空输入');
            };

            document.getElementById('btnClear').addEventListener('click', clearInput);
            document.getElementById('btnCopy').addEventListener('click', copyOut);
            railBtns.forEach((btn) => btn.addEventListener('click', () => run(btn.dataset.run)));

            elIn.addEventListener('input', paintAll);
            /* 手动改过结果后，条数按结果的行数重新算 */
            elOut.addEventListener('input', () => {
                outItems = lineCount(elOut.value);
                paintAll();
            });

            /* 行号栏跟随文本框滚动 */
            const follow = (ta, gut) => ta.addEventListener('scroll', () => {
                gut.scrollTop = ta.scrollTop;
            });
            follow(elIn, gutIn);
            follow(elOut, gutOut);

            document.addEventListener('keydown', (event) => {
                if (!event.ctrlKey && !event.metaKey) return;
                const shortcuts = { '1': 'quote', '2': 'plain' };
                if (shortcuts[event.key]) {
                    event.preventDefault();
                    run(shortcuts[event.key]);
                    return;
                }
                if (event.key === 'Enter' && lastRun) {
                    event.preventDefault();
                    run(lastRun);
                }
            });

            paintAll();
            elIn.focus();
        })();
    </script>
</body>

</html>
