<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="简约 JSON 工具：格式化、压缩、语法高亮、错误定位、树形查看、键排序、复制与下载。">
    <title>JSON 工具</title>
    <style>
        :root {
            --sans: -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
            --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
            --radius: 8px;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #ffffff;
            --surface: #f7f8fa;
            --panel: #ffffff;
            --line: #e4e7ec;
            --line-soft: #eef1f5;
            --text: #1b1f24;
            --muted: #667085;
            --faint: #98a2b3;
            --accent: #2563eb;
            --accent-ink: #ffffff;
            --accent-soft: rgba(37, 99, 235, .09);
            --sel: rgba(37, 99, 235, .18);
            --ok: #15803d;
            --err: #c62828;
            --err-soft: rgba(198, 40, 40, .07);
            --key: #0550ae;
            --str: #0a7a3e;
            --num: #b1560f;
            --lit: #7c3aed;
            --punc: #7a869a;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #14161a;
            --surface: #1a1d22;
            --panel: #171a1e;
            --line: #2b3038;
            --line-soft: #22262c;
            --text: #e5e8ed;
            --muted: #98a1ae;
            --faint: #6d7684;
            --accent: #7aa2ff;
            --accent-ink: #0f1319;
            --accent-soft: rgba(122, 162, 255, .12);
            --sel: rgba(122, 162, 255, .26);
            --ok: #5cc98d;
            --err: #f08080;
            --err-soft: rgba(240, 128, 128, .08);
            --key: #86b9ff;
            --str: #7fdfa6;
            --num: #f0b072;
            --lit: #c6a8ff;
            --punc: #8b94a3;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 var(--sans);
            -webkit-font-smoothing: antialiased;
            transition: background-color .15s ease, color .15s ease;
        }

        /* 顶部工具栏 */
        .bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px 14px;
            flex-wrap: wrap;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
        }

        .brand .mark {
            font: 600 15px/1 var(--mono);
            color: var(--accent);
            letter-spacing: -1px;
        }

        .brand h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 12px;
            font: 500 13px var(--sans);
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            cursor: pointer;
            transition: color .12s, background-color .12s, border-color .12s;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
            min-width: 66px;
        }

        .btn.primary:hover {
            color: var(--accent-ink);
            filter: brightness(1.07);
        }

        .btn.done {
            border-color: var(--ok);
            color: var(--ok);
        }

        .check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 4px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .check:hover {
            color: var(--text);
        }

        .check input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .icon-btn {
            appearance: none;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            padding: 0;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            cursor: pointer;
            transition: color .12s, border-color .12s;
        }

        .icon-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        html[data-theme="light"] .i-sun {
            display: none;
        }

        html[data-theme="dark"] .i-moon {
            display: none;
        }

        /* 主体双栏 */
        main {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .pane + .pane {
            border-left: 1px solid var(--line);
        }

        .pane-head {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-bottom: 1px solid var(--line-soft);
        }

        .pane-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .6px;
            color: var(--muted);
        }

        .hint {
            margin-left: auto;
            font-size: 12px;
            color: var(--faint);
        }

        .pane-tools {
            margin-left: auto;
            display: flex;
            gap: 4px;
        }

        .mini {
            appearance: none;
            padding: 2px 6px;
            font: 12px var(--sans);
            color: var(--muted);
            background: none;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .mini:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* 输入区：textarea 与高亮层严格重叠 */
        .editor {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            --gutter-w: 2.6em;
        }

        .editor-inner {
            position: relative;
            min-height: 100%;
        }

        .code-layer,
        #input {
            display: block;
            width: 100%;
            margin: 0;
            border: 0;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: normal;
            tab-size: 2;
            box-sizing: border-box;
        }

        .code-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px 14px 0;
            overflow: hidden;
            pointer-events: none;
        }

        .code-line {
            display: flex;
            align-items: flex-start;
        }

        .ln {
            flex: 0 0 var(--gutter-w);
            width: var(--gutter-w);
            padding-right: 12px;
            text-align: right;
            color: var(--faint);
            user-select: none;
            box-sizing: border-box;
        }

        .lc {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 1.7em;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: normal;
        }

        #input {
            position: relative;
            padding: 14px 16px 14px var(--gutter-w);
            background: transparent;
            color: transparent;
            caret-color: var(--accent);
            resize: none;
            outline: none;
            overflow: hidden;
        }

        #input::placeholder {
            color: var(--faint);
            -webkit-text-fill-color: var(--faint);
        }

        #input::selection {
            background: var(--sel);
            color: var(--text);
        }

        .editor.drop {
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        .tk-key {
            color: var(--key);
        }

        .tk-str {
            color: var(--str);
        }

        .tk-num {
            color: var(--num);
        }

        .tk-lit {
            color: var(--lit);
        }

        .tk-punc {
            color: var(--punc);
        }

        /* 结构树 */
        .tree {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: 10px 12px 24px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.7;
        }

        .tree:empty::before {
            content: "解析结果会显示在这里";
            font-family: var(--sans);
            font-size: 13px;
            color: var(--faint);
        }

        .node > .row {
            display: flex;
            align-items: flex-start;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .node.has-children > .row {
            cursor: pointer;
        }

        .node.has-children > .row:hover {
            background: var(--accent-soft);
        }

        .caret {
            flex: 0 0 13px;
            width: 13px;
            color: var(--faint);
            transition: transform .12s ease;
        }

        .node.collapsed > .row > .caret {
            transform: rotate(-90deg);
        }

        .children {
            margin-left: 6px;
            padding-left: 12px;
            border-left: 1px dashed var(--line-soft);
        }

        .node.collapsed > .children {
            display: none;
        }

        .k {
            color: var(--key);
        }

        .idx {
            color: var(--faint);
        }

        .colon {
            color: var(--punc);
        }

        .v.str {
            color: var(--str);
        }

        .v.num {
            color: var(--num);
        }

        .v.lit {
            color: var(--lit);
        }

        .sum {
            color: var(--muted);
        }

        .more-tip {
            padding: 8px 6px;
            font-family: var(--sans);
            font-size: 12px;
            color: var(--faint);
        }

        /* 历史记录 */
        .history-wrap {
            position: relative;
        }

        .history {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            width: 330px;
            max-height: 360px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 14px 32px rgba(12, 18, 28, .16);
            overflow: hidden;
        }

        .history[hidden] {
            display: none;
        }

        .history-head {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px 6px 12px;
            border-bottom: 1px solid var(--line-soft);
        }

        .history-title {
            margin-right: auto;
            font-size: 12px;
            color: var(--muted);
        }

        .history-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            border-radius: 7px;
        }

        .history-item:hover {
            background: var(--accent-soft);
        }

        .history-load {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 8px;
            background: none;
            border: 0;
            border-radius: 7px;
            text-align: left;
            cursor: pointer;
            color: var(--text);
        }

        .history-time {
            font-size: 11px;
            color: var(--faint);
        }

        .history-preview {
            display: block;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        .history-del {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            margin-right: 4px;
            background: none;
            border: 0;
            border-radius: 6px;
            color: var(--faint);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }

        .history-del:hover {
            color: var(--err);
            background: var(--err-soft);
        }

        .history-empty {
            padding: 14px 12px;
            font-size: 12px;
            color: var(--faint);
        }

        .btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* 状态栏 */
        .status {
            flex: 0 0 auto;
            padding: 7px 16px;
            border-top: 1px solid var(--line);
            background: var(--panel);
            font: 12px/1.5 var(--mono);
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status.ok {
            color: var(--ok);
        }

        .status.err {
            color: var(--err);
            cursor: pointer;
        }

        .status.err:hover {
            background: var(--err-soft);
        }

        @media (max-width: 860px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .pane + .pane {
                border-left: 0;
                border-top: 1px solid var(--line);
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="bar">
        <div class="brand">
            <span class="mark">{ }</span>
            <h1>JSON 工具</h1>
        </div>
        <div class="actions">
            <button class="btn primary" id="btnFormat" type="button">格式化</button>
            <button class="btn" id="btnMinify" type="button">压缩</button>
            <label class="check" id="sortLabel" for="optSort" title="递归按字典序排列对象键">
                <input type="checkbox" id="optSort">
                <span>键排序</span>
            </label>
            <button class="btn" id="btnCopy" type="button">复制</button>
            <button class="btn" id="btnDownload" type="button">下载</button>
            <button class="btn" id="btnClear" type="button">清空</button>
            <div class="history-wrap" id="historyWrap">
                <button class="btn" id="btnHistory" type="button" title="最近 20 条记录">历史</button>
                <div class="history" id="historyPanel" hidden>
                    <div class="history-head">
                        <span class="history-title">最近 20 条记录</span>
                        <button class="mini" id="btnClearHistory" type="button">清空记录</button>
                    </div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>
            <button class="icon-btn" id="btnTheme" type="button" title="切换明暗主题" aria-label="切换明暗主题">
                <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z" />
                </svg>
                <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <section class="pane">
            <div class="pane-head">
                <span class="pane-title">输入</span>
                <span class="hint">Ctrl + Enter 格式化 · Ctrl + Shift + Enter 压缩 · Tab 缩进</span>
            </div>
            <div class="editor" id="editor">
                <div class="editor-inner">
                    <div class="code-layer" id="codeLayer" aria-hidden="true"></div>
                    <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                        placeholder="在此粘贴 JSON，或把 .json 文件拖进来"></textarea>
                </div>
            </div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <span class="pane-title">结构</span>
                <div class="pane-tools">
                    <button class="mini" id="btnExpand" type="button">展开</button>
                    <button class="mini" id="btnCollapse" type="button">折叠</button>
                </div>
            </div>
            <div class="tree" id="tree"></div>
        </section>
    </main>

    <div class="status" id="status">等待输入…</div>

    <script>
        (function () {
            'use strict';

            var $ = function (id) { return document.getElementById(id); };

            var inputEl = $('input');
            var layerEl = $('codeLayer');
            var treeEl = $('tree');
            var statusEl = $('status');
            var editorEl = $('editor');
            var sortEl = $('optSort');
            var copyBtn = $('btnCopy');
            var themeBtn = $('btnTheme');
            var historyWrapEl = $('historyWrap');
            var historyPanelEl = $('historyPanel');
            var historyListEl = $('historyList');
            var historyBtn = $('btnHistory');

            var MAX_HIGHLIGHT = 400000;
            var MAX_HIGHLIGHT_LINES = 8000;
            var MAX_NODES = 30000;
            var HISTORY_MAX = 20;
            var HISTORY_ITEM_MAX = 200000;
            var TEXT_KEY = 'json-tool:text';
            var SORT_KEY = 'json-tool:sort';
            var THEME_KEY = 'json-tool:theme';
            var HISTORY_KEY = 'json-tool:history';

            var parsed = null;
            var frame = 0;
            var saveTimer = 0;
            var pendingText = null;
            var treeNodes = 0;
            var treeTruncated = false;
            var history = [];
            var historyTimer = 0;

            /* ---------- 主题 ---------- */
            function readTheme() {
                try {
                    var saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (e) { /* 忽略存储异常 */ }
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* 忽略存储异常 */ }
            }

            setTheme(readTheme());

            /* ---------- 错误信息 ---------- */
            var ERROR_HINTS = [
                [/Unexpected end of JSON input/, function () { return '内容不完整，JSON 没有正常结束'; }],
                [/Unexpected non-whitespace character after JSON/, function () { return 'JSON 结束之后还有多余内容'; }],
                [/Expected property name or '}'/, function () { return '这里需要一个属性名（双引号包裹的键），或者结束符 }'; }],
                [/Expected double-quoted property name/, function () { return '属性名必须使用双引号'; }],
                [/Expected ',' or '}' after property value/, function () { return '属性值之后需要 , 或者 }'; }],
                [/Expected ',' or ']' after array element/, function () { return '数组元素之后需要 , 或者 ]'; }],
                [/Unterminated string/, function () { return '字符串没有闭合'; }],
                [/Bad control character in string literal/, function () { return '字符串中含有未转义的控制字符'; }],
                [/Bad escaped character in JSON string/, function () { return '字符串中含有无效的转义字符'; }],
                [/Bad Unicode escape/, function () { return '原始转义 \\u 后面需要 4 位十六进制数字'; }],
                [/Exponent part is missing a number/, function () { return '指数部分缺少数字'; }],
                [/No number after minus sign/, function () { return '负号后面缺少数字'; }],
                [/Unexpected token (.+?) in JSON/, function (m) { return '这里出现了意外的字符 ' + m[1]; }],
                [/Unexpected token (.+?),/, function (m) { return '这里出现了意外的字符 ' + m[1]; }],
                [/is not valid JSON/, function () { return '无法解析为 JSON'; }]
            ];

            function hintFor(message) {
                for (var i = 0; i < ERROR_HINTS.length; i++) {
                    var m = ERROR_HINTS[i][0].exec(message);
                    if (m) return ERROR_HINTS[i][1](m);
                }
                return '';
            }

            function locate(err, text) {
                var message = String((err && err.message) || err);
                var posMatch = /position (\d+)/.exec(message);
                var lineMatch = /line (\d+) column (\d+)/.exec(message);
                var index = posMatch ? Number(posMatch[1]) : -1;
                var line = 0;
                var column = 0;

                if (lineMatch) {
                    line = Number(lineMatch[1]);
                    column = Number(lineMatch[2]);
                }
                if (index < 0 && line > 0) {
                    var rows = text.split('\n');
                    var acc = 0;
                    for (var i = 0; i < line - 1 && i < rows.length; i++) acc += rows[i].length + 1;
                    index = acc + column - 1;
                } else if (index >= 0 && line === 0) {
                    var before = text.slice(0, index);
                    line = before.split('\n').length;
                    column = index - before.lastIndexOf('\n');
                }
                return { index: index, line: line, column: column, message: message };
            }

            /* ---------- 解析 ---------- */
            function parseText(text) {
                if (!text.trim()) return { ok: false, empty: true };
                try {
                    return { ok: true, value: JSON.parse(text) };
                } catch (err) {
                    return { ok: false, error: locate(err, text) };
                }
            }

            /* ---------- 语法高亮与行号 ---------- */
            var TOKEN_RE = /("(?:\\.|[^"\\])*"?)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],:])/g;

            function escapeHtml(s) {
                return s.replace(/[&<>]/g, function (c) {
                    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
                });
            }

            function isSpace(c) {
                return c === ' ' || c === '\t' || c === '\n' || c === '\r';
            }

            function highlightLine(line) {
                if (!line) return '';

                var out = '';
                var last = 0;
                var m;
                TOKEN_RE.lastIndex = 0;

                while ((m = TOKEN_RE.exec(line)) !== null) {
                    if (m.index > last) out += escapeHtml(line.slice(last, m.index));

                    if (m[1] !== undefined) {
                        var i = TOKEN_RE.lastIndex;
                        while (i < line.length && isSpace(line[i])) i++;
                        out += '<span class="' + (line[i] === ':' ? 'tk-key' : 'tk-str') + '">' + escapeHtml(m[1]) + '</span>';
                    } else if (m[2] !== undefined) {
                        out += '<span class="tk-num">' + escapeHtml(m[2]) + '</span>';
                    } else if (m[3] !== undefined) {
                        out += '<span class="tk-lit">' + escapeHtml(m[3]) + '</span>';
                    } else {
                        out += '<span class="tk-punc">' + escapeHtml(m[4]) + '</span>';
                    }
                    last = TOKEN_RE.lastIndex;
                }

                if (last < line.length) out += escapeHtml(line.slice(last));
                return out;
            }

            function paint(text) {
                if (text === '') {
                    layerEl.innerHTML = '';
                    editorEl.style.setProperty('--gutter-w', '2.6em');
                    return;
                }

                var lines = text.split('\n');
                var numbered = lines.length <= MAX_HIGHLIGHT_LINES;
                var colored = numbered && text.length <= MAX_HIGHLIGHT;

                editorEl.style.setProperty('--gutter-w', 'calc(' + String(lines.length).length + 'ch + 24px)');

                var out = [];
                for (var i = 0; i < lines.length; i++) {
                    var code = colored ? highlightLine(lines[i]) : escapeHtml(lines[i]);
                    var num = numbered ? '<span class="ln">' + (i + 1) + '</span>' : '';
                    out.push('<div class="code-line">' + num + '<span class="lc">' + code + '</span></div>');
                }
                layerEl.innerHTML = out.join('');
            }

            function syncHeight() {
                inputEl.style.height = 'auto';
                var h = inputEl.scrollHeight;
                inputEl.style.height = h + 'px';
                layerEl.style.height = h + 'px';
            }

            /* ---------- 结构树 ---------- */
            function primitiveText(v) {
                return typeof v === 'string' ? JSON.stringify(v) : String(v);
            }

            function primitiveClass(v) {
                if (typeof v === 'string') return 'str';
                if (typeof v === 'number') return 'num';
                return 'lit';
            }

            function buildTree(key, value) {
                treeNodes++;

                var node = document.createElement('div');
                node.className = 'node';

                var row = document.createElement('div');
                row.className = 'row';

                var caret = document.createElement('span');
                caret.className = 'caret';
                row.appendChild(caret);

                var isArray = Array.isArray(value);
                var isBranch = value !== null && typeof value === 'object';

                if (key !== null) {
                    var keyEl = document.createElement('span');
                    if (typeof key === 'number') {
                        keyEl.className = 'idx';
                        keyEl.textContent = String(key);
                    } else {
                        keyEl.className = 'k';
                        keyEl.textContent = JSON.stringify(key);
                    }
                    row.appendChild(keyEl);

                    var colon = document.createElement('span');
                    colon.className = 'colon';
                    colon.textContent = ': ';
                    row.appendChild(colon);
                }

                if (!isBranch) {
                    var valueEl = document.createElement('span');
                    valueEl.className = 'v ' + primitiveClass(value);
                    valueEl.textContent = primitiveText(value);
                    row.appendChild(valueEl);
                    node.appendChild(row);
                    return node;
                }

                var entries = [];
                var i;
                if (isArray) {
                    for (i = 0; i < value.length; i++) entries.push([i, value[i]]);
                } else {
                    var keys = Object.keys(value);
                    for (i = 0; i < keys.length; i++) entries.push([keys[i], value[keys[i]]]);
                }

                var open = isArray ? '[' : '{';
                var close = isArray ? ']' : '}';
                var summary = document.createElement('span');
                summary.className = 'sum';
                summary.textContent = entries.length === 0
                    ? open + close
                    : open + '…' + close + ' ' + entries.length + (isArray ? ' 项' : ' 个键');
                row.appendChild(summary);
                node.appendChild(row);

                if (entries.length === 0) return node;

                node.classList.add('has-children');
                caret.textContent = '▾';

                var children = document.createElement('div');
                children.className = 'children';
                for (i = 0; i < entries.length; i++) {
                    if (treeNodes >= MAX_NODES) {
                        treeTruncated = true;
                        break;
                    }
                    children.appendChild(buildTree(entries[i][0], entries[i][1]));
                }
                node.appendChild(children);
                return node;
            }

            function renderTree() {
                treeEl.textContent = '';
                treeNodes = 0;
                treeTruncated = false;
                if (!parsed || !parsed.ok) return;

                treeEl.appendChild(buildTree(null, parsed.value));

                if (treeTruncated) {
                    var tip = document.createElement('div');
                    tip.className = 'more-tip';
                    tip.textContent = '节点过多，仅显示前 ' + MAX_NODES + ' 个节点';
                    treeEl.appendChild(tip);
                }
            }

            /* ---------- 状态栏 ---------- */
            function formatBytes(n) {
                if (n < 1024) return n + ' B';
                if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
                return (n / 1048576).toFixed(2) + ' MB';
            }

            function topLevelOf(value) {
                if (Array.isArray(value)) return value.length + ' 项';
                if (value !== null && typeof value === 'object') return Object.keys(value).length + ' 个键';
                return typeof value;
            }

            function setStatus(kind, text, title) {
                statusEl.className = 'status ' + kind;
                statusEl.textContent = text;
                statusEl.title = title || '';
            }

            function updateStatus(text) {
                if (!text.trim()) {
                    setStatus('idle', '等待输入…');
                    return;
                }
                if (!parsed.ok) {
                    var err = parsed.error;
                    var hint = hintFor(err.message);
                    var where = err.line > 0 ? '第 ' + err.line + ' 行第 ' + err.column + ' 列 · ' : '';
                    setStatus('err', '✕ ' + where + (hint ? hint + ' · ' : '') + err.message, '点击定位到错误位置');
                    return;
                }
                var bytes = new TextEncoder().encode(text).length;
                var lines = text.split('\n').length;
                setStatus('ok', '✓ 有效 JSON · ' + formatBytes(bytes) + ' · ' + lines + ' 行 · 顶层 ' + topLevelOf(parsed.value));
            }

            /* ---------- 渲染调度 ---------- */
            function render() {
                var text = inputEl.value;
                parsed = parseText(text);
                syncHeight();
                paint(text);
                renderTree();
                updateStatus(text);
                scheduleSave(text);
                scheduleHistory(text);
            }

            function schedule() {
                if (frame) return;
                frame = requestAnimationFrame(function () {
                    frame = 0;
                    render();
                });
            }

            /* ---------- 存储 ---------- */
            function scheduleSave(text) {
                pendingText = text;
                clearTimeout(saveTimer);
                saveTimer = setTimeout(flushSave, 500);
            }

            function flushSave() {
                clearTimeout(saveTimer);
                if (pendingText === null) return;
                var text = pendingText;
                pendingText = null;
                try {
                    if (text.length <= 200000) localStorage.setItem(TEXT_KEY, text);
                    else localStorage.removeItem(TEXT_KEY);
                } catch (e) { /* 忽略存储异常 */ }
            }

            /* ---------- 操作 ---------- */
            function sortDeep(value) {
                if (Array.isArray(value)) return value.map(sortDeep);
                if (value !== null && typeof value === 'object') {
                    var out = {};
                    Object.keys(value).sort().forEach(function (k) {
                        out[k] = sortDeep(value[k]);
                    });
                    return out;
                }
                return value;
            }

            function setInput(text) {
                inputEl.focus();
                inputEl.setSelectionRange(0, inputEl.value.length);
                var done = false;
                try { done = document.execCommand('insertText', false, text); } catch (e) { done = false; }
                if (!done) inputEl.value = text;
                inputEl.setSelectionRange(0, 0);
                render();
            }

            function focusError(info) {
                var index = Math.max(0, Math.min(info.index, inputEl.value.length));
                inputEl.focus();
                inputEl.setSelectionRange(index, index);
            }

            function transform(indent) {
                var text = inputEl.value;
                if (!text.trim()) return;

                var value;
                try {
                    value = JSON.parse(text);
                } catch (err) {
                    render();
                    focusError(locate(err, text));
                    return;
                }

                var target = sortEl.checked ? sortDeep(value) : value;
                setInput(indent === 0 ? JSON.stringify(target) : JSON.stringify(target, null, indent));
            }

            function flash(btn, label) {
                if (!btn.dataset.label) btn.dataset.label = btn.textContent;
                btn.textContent = label;
                btn.classList.add('done');
                clearTimeout(btn._timer);
                btn._timer = setTimeout(function () {
                    btn.textContent = btn.dataset.label;
                    btn.classList.remove('done');
                }, 1200);
            }

            async function copyText() {
                var text = inputEl.value;
                if (!text) return;

                var done = false;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        done = true;
                    } catch (e) { done = false; }
                }
                if (!done) {
                    try {
                        inputEl.focus();
                        inputEl.setSelectionRange(0, text.length);
                        done = document.execCommand('copy');
                        inputEl.setSelectionRange(text.length, text.length);
                    } catch (e) { done = false; }
                }
                flash(copyBtn, done ? '已复制' : '复制失败');
            }

            function download() {
                var text = inputEl.value;
                if (!text) return;
                var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            }

            function clearAll() {
                inputEl.value = '';
                pendingText = null;
                clearTimeout(saveTimer);
                try { localStorage.removeItem(TEXT_KEY); } catch (e) { /* 忽略存储异常 */ }
                render();
                inputEl.focus();
            }

            /* ---------- 历史记录 ---------- */
            function readHistory() {
                var list = [];
                try {
                    var raw = localStorage.getItem(HISTORY_KEY);
                    var arr = raw ? JSON.parse(raw) : [];
                    if (Array.isArray(arr)) {
                        for (var i = 0; i < arr.length && list.length < HISTORY_MAX; i++) {
                            var item = arr[i];
                            if (item && typeof item.v === 'string' && typeof item.t === 'number') {
                                list.push({ t: item.t, v: item.v });
                            }
                        }
                    }
                } catch (e) { list = []; }
                return list;
            }

            function persistHistory() {
                for (;;) {
                    try {
                        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                        return true;
                    } catch (e) {
                        if (history.length <= 1) {
                            try { localStorage.removeItem(HISTORY_KEY); } catch (e2) { /* 忽略存储异常 */ }
                            return false;
                        }
                        history.pop();
                    }
                }
            }

            function pushHistory(text) {
                if (!text.trim() || text.length > HISTORY_ITEM_MAX) return;
                if (history.length && history[0].v === text) return;

                for (var i = history.length - 1; i >= 0; i--) {
                    if (history[i].v === text) history.splice(i, 1);
                }
                history.unshift({ t: Date.now(), v: text });
                if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;

                persistHistory();
                renderHistoryList();
            }

            function scheduleHistory(text) {
                clearTimeout(historyTimer);
                historyTimer = setTimeout(function () { pushHistory(text); }, 1500);
            }

            function formatTime(ts) {
                var d = new Date(ts);
                var now = new Date();
                var pad = function (n) { return (n < 10 ? '0' : '') + n; };
                var sameDay = d.getFullYear() === now.getFullYear()
                    && d.getMonth() === now.getMonth()
                    && d.getDate() === now.getDate();
                var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
                return sameDay ? hm : pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
            }

            function previewOf(text) {
                var s = text.replace(/\s+/g, ' ').trim();
                return s.length > 96 ? s.slice(0, 96) + '…' : s;
            }

            function renderHistoryList() {
                historyListEl.textContent = '';

                if (!history.length) {
                    var empty = document.createElement('div');
                    empty.className = 'history-empty';
                    empty.textContent = '还没有记录，输入内容后会自动保存';
                    historyListEl.appendChild(empty);
                    return;
                }

                history.forEach(function (item, index) {
                    var row = document.createElement('div');
                    row.className = 'history-item';

                    var load = document.createElement('button');
                    load.className = 'history-load';
                    load.type = 'button';
                    load.title = '载入这条记录';

                    var time = document.createElement('span');
                    time.className = 'history-time';
                    time.textContent = formatTime(item.t);

                    var text = document.createElement('span');
                    text.className = 'history-preview';
                    text.textContent = previewOf(item.v);

                    load.appendChild(time);
                    load.appendChild(text);
                    load.addEventListener('click', function () {
                        inputEl.value = item.v;
                        render();
                        pushHistory(item.v);
                        closeHistory();
                    });

                    var del = document.createElement('button');
                    del.className = 'history-del';
                    del.type = 'button';
                    del.title = '删除这条记录';
                    del.textContent = '×';
                    del.addEventListener('click', function (e) {
                        e.stopPropagation();
                        history.splice(index, 1);
                        persistHistory();
                        renderHistoryList();
                    });

                    row.appendChild(load);
                    row.appendChild(del);
                    historyListEl.appendChild(row);
                });
            }

            function positionHistory() {
                var rect = historyBtn.getBoundingClientRect();
                var width = Math.min(330, window.innerWidth - 24);
                var left = Math.min(rect.left, window.innerWidth - width - 12);
                historyPanelEl.style.width = width + 'px';
                historyPanelEl.style.left = Math.max(12, left) + 'px';
                historyPanelEl.style.top = (rect.bottom + 8) + 'px';
                historyPanelEl.style.maxHeight = Math.max(180, Math.min(360, window.innerHeight - rect.bottom - 24)) + 'px';
            }

            function openHistory() {
                renderHistoryList();
                historyPanelEl.hidden = false;
                historyBtn.classList.add('active');
                positionHistory();
            }

            function closeHistory() {
                historyPanelEl.hidden = true;
                historyBtn.classList.remove('active');
            }

            function toggleHistory() {
                if (historyPanelEl.hidden) openHistory();
                else closeHistory();
            }

            /* ---------- 事件 ---------- */
            inputEl.addEventListener('input', schedule);

            inputEl.addEventListener('keydown', function (e) {
                if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    var ok = false;
                    try { ok = document.execCommand('insertText', false, '  '); } catch (err) { ok = false; }
                    if (!ok) {
                        var start = inputEl.selectionStart;
                        inputEl.value = inputEl.value.slice(0, start) + '  ' + inputEl.value.slice(inputEl.selectionEnd);
                        inputEl.setSelectionRange(start + 2, start + 2);
                    }
                    render();
                    return;
                }
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    transform(e.shiftKey ? 0 : 2);
                }
            });

            statusEl.addEventListener('click', function () {
                if (!parsed || parsed.ok || !parsed.error || parsed.error.index < 0) return;
                focusError(parsed.error);
            });

            function setAllCollapsed(collapsed) {
                var nodes = treeEl.querySelectorAll('.node.has-children');
                for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('collapsed', collapsed);
            }

            $('btnFormat').addEventListener('click', function () { transform(2); });
            $('btnMinify').addEventListener('click', function () { transform(0); });
            copyBtn.addEventListener('click', copyText);
            $('btnDownload').addEventListener('click', download);
            $('btnClear').addEventListener('click', clearAll);
            historyBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleHistory();
            });
            $('btnClearHistory').addEventListener('click', function () {
                history = [];
                try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* 忽略存储异常 */ }
                renderHistoryList();
            });
            document.addEventListener('mousedown', function (e) {
                if (historyPanelEl.hidden) return;
                if (historyWrapEl.contains(e.target)) return;
                closeHistory();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !historyPanelEl.hidden) closeHistory();
            });
            $('btnExpand').addEventListener('click', function () { setAllCollapsed(false); });
            $('btnCollapse').addEventListener('click', function () { setAllCollapsed(true); });

            themeBtn.addEventListener('click', function () {
                setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });

            function applySort() {
                try { localStorage.setItem(SORT_KEY, sortEl.checked ? '1' : '0'); } catch (e) { /* 忽略存储异常 */ }
                if (!parsed || !parsed.ok) return;
                transform(/\n/.test(inputEl.value) ? 2 : 0);
            }

            sortEl.addEventListener('change', applySort);

            $('sortLabel').addEventListener('click', function (e) {
                e.preventDefault();
                sortEl.checked = !sortEl.checked;
                applySort();
            });

            treeEl.addEventListener('click', function (e) {
                var row = e.target.closest ? e.target.closest('.row') : null;
                if (!row) return;
                var node = row.parentElement;
                if (!node || !node.classList.contains('has-children')) return;
                node.classList.toggle('collapsed');
            });

            editorEl.addEventListener('mousedown', function (e) {
                if (e.target === editorEl || e.target.classList.contains('editor-inner')) {
                    e.preventDefault();
                    var len = inputEl.value.length;
                    inputEl.focus();
                    inputEl.setSelectionRange(len, len);
                }
            });

            window.addEventListener('dragover', function (e) { e.preventDefault(); });
            window.addEventListener('drop', function (e) { e.preventDefault(); });

            editorEl.addEventListener('dragenter', function (e) {
                e.preventDefault();
                editorEl.classList.add('drop');
            });
            editorEl.addEventListener('dragover', function (e) {
                e.preventDefault();
                editorEl.classList.add('drop');
            });
            editorEl.addEventListener('dragleave', function () {
                editorEl.classList.remove('drop');
            });
            editorEl.addEventListener('drop', function (e) {
                e.preventDefault();
                editorEl.classList.remove('drop');
                var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function () {
                    inputEl.value = String(reader.result);
                    render();
                };
                reader.readAsText(file, 'utf-8');
            });

            window.addEventListener('beforeunload', flushSave);

            window.addEventListener('resize', function () {
                if (!historyPanelEl.hidden) positionHistory();
            });

            var lastWidth = 0;
            if (window.ResizeObserver) {
                new ResizeObserver(function (entries) {
                    var width = entries[0].contentRect.width;
                    if (Math.abs(width - lastWidth) < 1) return;
                    lastWidth = width;
                    requestAnimationFrame(syncHeight);
                }).observe(editorEl);
            }

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () { syncHeight(); });
            }

            /* ---------- 初始化 ---------- */
            try {
                sortEl.checked = localStorage.getItem(SORT_KEY) === '1';
            } catch (e) { /* 忽略存储异常 */ }

            try {
                var savedText = localStorage.getItem(TEXT_KEY);
                if (savedText) inputEl.value = savedText;
            } catch (e) { /* 忽略存储异常 */ }

            history = readHistory();
            renderHistoryList();

            render();
            inputEl.focus();
        })();
    </script>
</body>

</html>
